[project]
name = "ua-rates2"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Flask==3.0.3",
    "gunicorn==26.2.0",
    "requests==2.27.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_also = ['if __name__ == "__main__":']

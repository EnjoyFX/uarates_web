name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # для пушу бейджа в гілку badges
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2  # astral не публікує плаваючі мажорні теги
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run JS tests (static site)
        run: npm test 2>&1 | tee js-tests.log  # bash в Actions запускається з pipefail

      # JSON для shields.io живе в окремій гілці badges, щоб не засмічувати історію main
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Бейдж показує гірше з двох покриттів: Python-застосунок і логіка статичного сайту
          py=$(uv run coverage report --format=total)
          # підсумковий рядок Node: "all files | 100.00 | …" (без терміналу підпис обрізається до "… files")
          js=$(awk -F'|' '/files[[:space:]]*\|/ {v=int($2)} END {print v}' js-tests.log)
          total=$(( py < js ? py : js ))
          if   [ "$total" -ge 90 ]; then color=brightgreen
          elif [ "$total" -ge 75 ]; then color=yellow
          else color=red; fi
          mkdir badge && cd badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$total" "$color" > coverage.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage ${total}%"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

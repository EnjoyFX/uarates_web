name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "static/app.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Статичний сайт використовує ті самі стилі, що й Flask-версія
      - name: Assemble site
        run: |
          mkdir _site
          cp site/index.html site/app.js site/lib.js static/app.css _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
